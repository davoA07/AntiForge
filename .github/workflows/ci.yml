name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log || {
            echo "::error title=pnpm install failed::$(grep -iE 'ERR_|error|warn' install.log | head -8 | tr '\n' ' ')"
            exit 1
          }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
